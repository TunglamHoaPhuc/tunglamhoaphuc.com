name: Content snapshot
description: Puts data/snapshot/*.json in place (it is not in git), from cache, from the snapshot-data release, or (old fallback) from the old site's public API.
runs:
  using: composite
  steps:
    - id: week
      shell: bash
      run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: data/snapshot
        key: snapshot-${{ hashFiles('scripts/fetch-snapshot.ts') }}-${{ steps.week.outputs.week }}
    # www no longer serves the old site's API, so the data comes from the snapshot-data release (upload: see docs/van-hanh/ci.md).
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! test -f data/snapshot/posts.json -a -f data/snapshot/post-albums.json; then
          mkdir -p data/snapshot
          gh release download snapshot-data --repo "$GITHUB_REPOSITORY" --pattern snapshot.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/snapshot.tar.gz" -C data/snapshot
        fi
        test -f data/snapshot/posts.json -a -f data/snapshot/post-albums.json
