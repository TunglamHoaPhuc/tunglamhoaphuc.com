# T1b: a merge into main puts the site on v2 (Worker tlhp-web). Only the deploy step sees the
# Cloudflare secrets. The www switch (T22) is a separate, deliberate change to cloudflare.config.ts.
name: Deploy v2

on:
  push:
    branches: [main]

concurrency:
  group: deploy-v2
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: ./.github/actions/snapshot
      # `npm run deploy:v2` builds and deploys in one go.
      - run: npm run deploy:v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx playwright install --with-deps chromium
      # The deployed copy answers like the one tested: home, 404, noindex, robots, sitemap.
      - run: npx playwright test smoke seo --project=desktop
        env:
          BASE_URL: https://v2.tunglamhoaphuc.com
