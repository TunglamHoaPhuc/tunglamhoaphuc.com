# Deploys the Worker tlhp-web, which now serves only the admin (quantri.). Run by hand: a merge into main
# no longer deploys (it would have to keep TLHP_ADMIN and ADMIN_BASE_URL, and www is served by tlhp-v3).
# Only the deploy step sees the Cloudflare secrets.
name: Deploy v2

on:
  workflow_dispatch:

concurrency:
  group: deploy-v2
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: ./.github/actions/snapshot
      # `npm run deploy:v2` builds and deploys in one go.
      # Without these two the admin answers 503 (CLAUDE.md): keep them on every deploy.
      - run: npm run deploy:v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TLHP_ADMIN: "1"
          ADMIN_BASE_URL: https://quantri.tunglamhoaphuc.com
